<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="Nakładaj plany zajęć z USOS i znajdź wspólne okienka na obiad."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FreeTime" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>USOS FreeTime</title>
    <script>
      try {
        var raw = localStorage.getItem('freetime:settings');
        var s = raw ? JSON.parse(raw) : {};
        if (!raw) {
          var legacy = localStorage.getItem('freetime:theme');
          if (legacy === 'dark' || legacy === 'light') s.theme = legacy;
        }
        var root = document.documentElement;
        var dark =
          s.theme === 'dark' ||
          (s.theme !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) root.classList.add('dark');
        if (s.accent) root.classList.add('accent-' + s.accent);
        var sizes = { small: '14px', large: '18px' };
        if (sizes[s.fontScale]) root.style.fontSize = sizes[s.fontScale];
      } catch (e) {}
    </script>
    <script>
      // Zabezpieczenie: jeśli aplikacja się nie uruchomiła (np. stara wersja w pamięci
      // podręcznej wskazuje na nieistniejące pliki), po 8 s pokazujemy przycisk naprawy.
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childNodes.length > 0) return;

          root.innerHTML =
            '<div style="max-width:28rem;margin:4rem auto;padding:1.5rem;font-family:system-ui,sans-serif;text-align:center">' +
            '<h1 style="font-size:1.25rem;margin:0 0 .5rem">Aplikacja nie mogła się uruchomić</h1>' +
            '<p style="color:#64748b;font-size:.9rem;margin:0 0 1rem">Najczęściej to stara wersja w pamięci podręcznej przeglądarki.</p>' +
            '<button id="ff-reset" style="background:#4f46e5;color:#fff;border:0;border-radius:.5rem;padding:.6rem 1.2rem;font-size:1rem;cursor:pointer">Wyczyść pamięć podręczną i odśwież</button>' +
            '</div>';

          document.getElementById('ff-reset').onclick = function () {
            var tasks = [];
            if (navigator.serviceWorker) {
              tasks.push(
                navigator.serviceWorker.getRegistrations().then(function (list) {
                  return Promise.all(list.map(function (item) { return item.unregister(); }));
                })
              );
            }
            if (window.caches) {
              tasks.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (key) { return caches.delete(key); }));
                })
              );
            }
            Promise.all(tasks).catch(function () {}).then(function () { location.reload(); });
          };
        }, 8000);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
