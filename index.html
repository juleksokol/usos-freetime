<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="Nakładaj plany zajęć z USOS i znajdź wspólne okienka na obiad."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FreeTime" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>USOS FreeTime</title>
    <script>
      try {
        var raw = localStorage.getItem('freetime:settings');
        var s = raw ? JSON.parse(raw) : {};
        if (!raw) {
          var legacy = localStorage.getItem('freetime:theme');
          if (legacy === 'dark' || legacy === 'light') s.theme = legacy;
        }
        var root = document.documentElement;
        var dark =
          s.theme === 'dark' ||
          (s.theme !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) root.classList.add('dark');
        if (s.accent) root.classList.add('accent-' + s.accent);
        var sizes = { small: '14px', large: '18px' };
        if (sizes[s.fontScale]) root.style.fontSize = sizes[s.fontScale];
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
